<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLONGI RECORDS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5e5a">
<link rel="icon" href="138817.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#9ebfba;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#c5d9d6;width:90%;max-width:380px;padding:40px 30px;border-radius:30px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.1)}
  .logo{width:80px;height:80px;background:white;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px;font-weight:800;color:#5a8a87}
  h1{font-size:22px;color:#1d3f3c;letter-spacing:1px}
  p{font-size:13px;color:#6d9a96;margin:6px 0 25px}
  input{width:100%;padding:16px;border:none;background:#e1eeec;border-radius:14px;text-align:center;font-size:16px;outline:none;margin-bottom:15px}
  button{width:100%;padding:16px;border:none;background:white;border-radius:14px;font-size:16px;font-weight:600;color:#5a8a87;cursor:pointer}
  button:active{transform:scale(0.98)}
  #vault{display:none}
  .song{padding:12px;background:#e1eeec;border-radius:10px;margin:8px 0;text-align:left}
</style>
</head>
<body>

<div class="card" id="loginBox">
  <div class="logo">M</div>
  <h1>MOLONGI RECORDS</h1>
  <p>Vault V • Privé</p>
  <input type="password" id="code" placeholder="Code d'accès">
  <button onclick="checkCode()">Entrer</button>
</div>

<div class="card" id="vault">
  <div class="logo">M</div>
  <h1>MOLONGI VAULT</h1>
  <p>Bienvenue Boss</p>
  <div id="content"></div>
</div>

<script>
function checkCode(){
  let c = document.getElementById('code').value;
  if(c === 'molongi2026'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('vault').style.display='block';
    document.getElementById('content').innerHTML = '<div class=\"song\">🎵 Ton contenu privé ici</div><div class=\"song\">🎵 Ajoute tes sons / liens ici</div>';
  } else {
    alert('Code incorrect');
  }
}

// PWA install
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
}
</script>
</body>
</html>
