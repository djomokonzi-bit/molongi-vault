<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molongi Vault - Player</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2e1a">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background: radial-gradient(120% 120% at 50% 10%, #ff9a2e 0%, #b85a00 45%, #2a1200 100%);min-height:100vh;color:white;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0}
.header{width:92%;max-width:500px;display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:1px}
.logo-icon{width:36px;height:36px;background:#fff url('138817.png') center/70% no-repeat;background-color:#2a7a7a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#2a7a7a}
.cover-flow{position:relative;width:100%;height:52vh;max-height:420px;display:flex;align-items:center;justify-content:center;perspective:1000px;margin:20px 0}
.card{position:absolute;width:220px;height:300px;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);transition:all 0.6s cubic-bezier(0.23,1,0.32,1);cursor:pointer;border:1px solid rgba(255,255,255,0.15)}
.card img{width:100%;height:100%;object-fit:cover}
.card-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,0.9));padding:14px 12px}
.card-info h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info p{font-size:11px;opacity:0.7}
.card.active{transform: translateX(0) translateZ(80px) scale(1.15);z-index:10;filter:brightness(1.1)}
.card.prev1{transform: translateX(-140px) translateZ(-20px) rotateY(25deg) scale(0.9);z-index:5;filter:brightness(0.7)}
.card.next1{transform: translateX(140px) translateZ(-20px) rotateY(-25deg) scale(0.9);z-index:5;filter:brightness(0.7)}
.card.prev2{transform: translateX(-250px) translateZ(-80px) rotateY(35deg) scale(0.8);z-index:2;filter:brightness(0.5)}
.card.next2{transform: translateX(250px) translateZ(-80px) rotateY(-35deg) scale(0.8);z-index:2;filter:brightness(0.5)}
.player-bar{width:92%;max-width:600px;background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:100px;padding:10px 18px;display:flex;align-items:center;gap:14px}
.controls{display:flex;align-items:center;gap:12px}
.ctrl-btn{background:none;border:none;color:white;font-size:18px;cursor:pointer}
.now-playing{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.now-playing img{width:42px;height:42px;border-radius:8px;object-fit:cover}
.np-text{flex:1;min-width:0}
.np-text h4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-text p{font-size:11px;opacity:0.6}
.progress{width:100%;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;margin-top:4px;overflow:hidden}
.progress-fill{height:100%;background:white;width:0%;transition:width 0.1s}
.search-box{width:92%;max-width:500px;margin-bottom:10px}
.search-box input{width:100%;padding:12px 16px;border-radius:100px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.12);color:white;outline:none}
.search-box input::placeholder{color:rgba(255,255,255,0.6)}
.vault-list{width:92%;max-width:500px;display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.pill{white-space:nowrap;padding:8px 14px;border-radius:100px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15);font-size:12px;cursor:pointer}
.pill.active{background:white;color:#7a3a00;font-weight:600}
</style>
</head>
<body>
<div class="header">
<div class="logo"><div class="logo-icon">M</div><span>MOLONGI VAULT</span></div><h1>Vault</h1>
</div>
<div class="search-box"><input id="search" placeholder="Rechercher une chanson..." oninput="filterTracks()"></div>
<div class="vault-list"><div class="pill active" onclick="setFilter('all',this)">Tout</div><div class="pill" onclick="setFilter('afro',this)">Afro</div><div class="pill" onclick="setFilter('kinshasa',this)">Kinshasa</div><div class="pill" onclick="setFilter('drill',this)">Drill</div></div>
<div class="cover-flow" id="coverFlow"></div>
<div class="player-bar">
<div class="controls">
<button class="ctrl-btn" onclick="prev()">⏮</button>
<button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">⏸</button>
<button class="ctrl-btn" onclick="next()">⏭</button>
</div>
<div class="now-playing">
<img id="npImg" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200">
<div class="np-text">
<h4 id="npTitle">SIMPLICITÉ - Afro</h4>
<p id="npArtist">By Molongi • 01</p>
<div class="progress"><div class="progress-fill" id="prog"></div></div>
</div>
</div>
<div class="right-ctrls"><button class="ctrl-btn">🔊</button></div>
</div>
<audio id="audio" src="simplicite-afro-01.mp3" preload="metadata"></audio>
<script>
const tracks = [
{title:"SIMPLICITÉ - Afro", artist:"By Molongi • 01", genre:"afro", cover:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500", src:"simplicite-afro-01.mp3"},
{title:"FREESTYLE KINSHASA", artist:"By Molongi", genre:"kinshasa", cover:"https://images.unsplash.com/photo-1516450360452-9312abbf6f7e?w=500", src:"simplicite-afro-01.mp3"},
{title:"AFRO DRILL BEAT", artist:"Beat • 2026", genre:"drill", cover:"https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=500", src:"simplicite-afro-01.mp3"},
{title:"LIBER VIBES", artist:"Molongi Records", genre:"afro", cover:"https://images.unsplash.com/photo-1493676304819-0d7a8d026dcf?w=500", src:"simplicite-afro-01.mp3"},
{title:"KINSHASA NIGHTS", artist:"Vault", genre:"kinshasa", cover:"https://images.unsplash.com/photo-1506157786151-b8491531f063?w=500", src:"simplicite-afro-01.mp3"}
];
let current=0;let filtered=[...tracks];let isPlaying=true;
function render(){const flow=document.getElementById('coverFlow');flow.innerHTML='';filtered.forEach((t,i)=>{const div=document.createElement('div');let cls='card';if(i===current) cls+=' active';else if(i===current-1) cls+=' prev1';else if(i===current+1) cls+=' next1';else if(i===current-2) cls+=' prev2';else if(i===current+2) cls+=' next2';else {div.style.display='none'}div.className=cls;div.innerHTML=`<img src="${t.cover}"><div class="card-info"><h3>${t.title}</h3><p>${t.artist}</p></div>`;div.onclick=()=>{current=i;updatePlayer();render();play()};flow.appendChild(div);});}
function updatePlayer(){const t=filtered[current];document.getElementById('npTitle').textContent=t.title;document.getElementById('npArtist').textContent=t.artist;document.getElementById('npImg').src=t.cover;document.getElementById('audio').src=t.src;}
function togglePlay(){const a=document.getElementById('audio');if(a.paused){a.play();document.getElementById('playBtn').textContent='⏸'}else{a.pause();document.getElementById('playBtn').textContent='▶'}}
function play(){const a=document.getElementById('audio');a.play().catch(()=>{});document.getElementById('playBtn').textContent='⏸'}
function next(){current=(current+1)%filtered.length;updatePlayer();render();play()}
function prev(){current=(current-1+filtered.length)%filtered.length;updatePlayer();render();play()}
function setFilter(g,el){document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');if(g==='all') filtered=[...tracks]; else filtered=tracks.filter(t=>t.genre.includes(g));current=0;updatePlayer();render();play();}
function filterTracks(){const q=document.getElementById('search').value.toLowerCase();filtered=tracks.filter(t=>t.title.toLowerCase().includes(q));current=0;updatePlayer();render();}
const audio=document.getElementById('audio');audio.addEventListener('timeupdate',()=>{const pct=(audio.currentTime/audio.duration)*100;document.getElementById('prog').style.width=pct+'%'});audio.addEventListener('ended',()=>next());
render();setTimeout(()=>audio.play().catch(()=>{}),500);
</script>
</body>
</html>
